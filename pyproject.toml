[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ur3-vision-manipulation"
version = "0.1.0"
description = "Robotics geometry core for UR3 vision-guided manipulation"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
